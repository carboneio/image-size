name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ '18', '20', '22', '24', '26' ]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # No dependency needs its install script: esbuild falls back to resolving
      # its platform binary at runtime, and fsevents ships prebuilt.
      - name: Build and run all tests
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
